  if(e.target.id==='authForm'){e.preventDefault();const i=$('#authPin');if(i)S.authPin=i.value;await autorizar();render();return}
  if(e.target.id!=='loginForm')return;e.preventDefault();
  const i=$('#pinIn');if(i)S.pinIn=i.value;
  await ACT.entrar();render()});
document.addEventListener('input',e=>{const el=e.target;
  if(el.id==='cajNombre')S.cajLogin.id=el.value;
  else if(el.id==='cajBarra')S.cajLogin.barra=el.value;
  else if(el.id==='cajClave')S.cajLogin.clave=el.value;
  else if(el.id==='nuevoCajNombre')S.cajNuevo.nombre=el.value;
  else if(el.id==='nuevoCajClave')S.cajNuevo.clave=el.value;
  else if(el.dataset.cn)(S.cajEd[el.dataset.cn]||(S.cajEd[el.dataset.cn]={})).nombre=el.value;
  else if(el.dataset.ck)(S.cajEd[el.dataset.ck]||(S.cajEd[el.dataset.ck]={})).clave=el.value;
  else if(el.dataset.cr)(S.cajEd[el.dataset.cr]||(S.cajEd[el.dataset.cr]={})).rol=el.value;
  else if(el.id==='nuevoCajRol')S.cajNuevo.rol=el.value;
  else if(el.dataset.bn)S.barEd[el.dataset.bn]=el.value;
  else if(el.id==='barNuevaNombre')S.barNueva=el.value;
  else if(el.id==='authPin')S.authPin=el.value;

  else if(el.id==='proveedor')S.proveedor=el.value;
  else if(el.id==='efectivo')S.efectivo=el.value;
  else if(el.id==='nuevoEv')S.nuevoEv=el.value;
  else if(el.id==='editEvNombre')S.editEvNombre=el.value;
  else if(el.id==='pinIn')S.pinIn=el.value;
  else if(el.id==='pinNuevo')S.pinNuevo=el.value;
  else if(el.dataset.mq)S.movQty[el.dataset.mq]=el.value;
  else if(el.dataset.cq)S.conteo[el.dataset.cq]=el.value});
document.addEventListener('change',e=>{const el=e.target;
  if(el.id==='barraSel'){ACT.setBarra(el.value);el.blur();render();return}                /* barra de trabajo: cajero o encargado */
  if(rolActual()!=='encargado')return;         /* evento, productos y barras: solo encargado */
  if(el.id==='comBarraSel'){S.comBarra=el.value;el.blur();render();return}
  if(el.id==='movBarraSel'){ACT.movBarra(el.value);el.blur();render();return}
  if(el.id==='cierreBarraSel'){ACT.cierreBarra(el.value);el.blur();render();return}
  if(el.id==='evSel'){cambiarEvento(el.value);el.blur();render();return}
  if(el.dataset.pf){const f=el.dataset.pf;let v=el.type==='checkbox'?el.checked:el.value;
    if(['precio','costo','minimo'].includes(f))v=Math.max(0,+v||0);if(f==='nombre'&&!String(v).trim())return;
    w(()=>S.db.doc('productos/'+el.dataset.pid).update({[f]:v}))}});

/* ---------- exportar a Excel ---------- */
function cargarXLSX(){return window.XLSX?Promise.resolve():new Promise((ok,no)=>{const s=document.createElement('script');
  s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';s.onload=ok;s.onerror=no;document.head.appendChild(s)})}
async function exportar(){
  if(!S.dl)return toast('Exportar no está disponible en esta pantalla.',true);
  S.exportando=true;render();
  try{await cargarXLSX();
    const ev=(S.eventos.find(e=>e.id===evId())||{nombre:evId()}).nombre;
    const fh=t=>t?new Date(t).toLocaleString('es-AR'):'';
    const ventas=[];const otros=[];const resumen={};
    for(const m of [...S.movs].sort((a,b)=>(a.at||0)-(b.at||0))){
      if(m.tipo==='venta')for(const x of m.lineas||[]){ventas.push({'Fecha y hora':fh(m.at),'Lado':barraNom(m.barra),'Pedido':m.numero||'','Cajero':m.quien||'','Producto':prod(x.p).nombre,'Cantidad':x.q,'Precio':x.precio,'Subtotal':x.q*x.precio,'Costo':x.q*x.costo,'Medio de pago':nombrePago(m.pago),'Efectivo':m.pago==='efectivo'?x.q*x.precio:0,'Mercado Pago':m.pago==='mercadopago'?x.q*x.precio:0,'Tarjeta':m.pago==='tarjeta'?x.q*x.precio:0,'Entregado':m.entregado===false?'No':'Sí','Entregado por':m.entregadoPor||''});
        const r=resumen[x.p]||(resumen[x.p]={'Producto':prod(x.p).nombre,'Unidades':0,'Facturación':0,'Costo':0});r.Unidades+=x.q;r['Facturación']+=x.q*x.precio;r.Costo+=x.q*x.costo}
      else if(m.tipo==='anulacion')otros.push({'Fecha y hora':fh(m.at),'Tipo':TIPOS.anulacion,'Motivo':m.detalle||'','Lado / proveedor':m.barra||'','Producto':'','Cantidad':'','Quién':m.quien||''});
      else for(const x of m.lineas||[])otros.push({'Fecha y hora':fh(m.at),'Tipo':TIPOS[m.tipo]||m.tipo,'Motivo':m.motivo||'','Lado / proveedor':m.tipo==='compra'?(m.proveedor||''):barraNom(m.barra),'Producto':prod(x.p).nombre,'Cantidad':x.q,'Quién':m.quien||''})}
    const res=Object.values(resumen).map(r=>({...r,'Ganancia':r['Facturación']-r.Costo,'Margen':r['Facturación']?Math.round((r['Facturación']-r.Costo)/r['Facturación']*1000)/10+'%':''})).sort((a,b)=>b.Ganancia-a.Ganancia);
    const cie=[];for(const b of Object.keys(S.cierres)){const k=cierreCalc(b);
      for(const f of k.filas)cie.push({'Lado':barraNom(b),'Producto':prod(f.p).nombre,'Recibió':f.recibido,'Vendió':f.vendido,'Bajas':f.bajas,'Debería quedar':f.esperado,'Contado':f.contado,'Diferencia':f.dif});
      cie.push({'Lado':barraNom(b),'Producto':'EFECTIVO','Debería quedar':k.efEsperado,'Contado':k.efContado,'Diferencia':k.efContado-k.efEsperado})}
    const wb=XLSX.utils.book_new();
    const hoja=(rows,n,vacio)=>XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(rows.length?rows:[{'':vacio}]),n);
    const ses=S.sesiones.map(x=>({'Fecha':x.fecha||new Date(x.at).toLocaleDateString('es-AR'),'Hora':x.hora||new Date(x.at).toLocaleTimeString('es-AR'),'Cajero':x.cajero||'','Rol':ROLES_PERSONAL[x.rol||'cajero']||'','Barra':x.barraNombre||barraNom(x.barra),'Tipo':x.tipo==='salida'?'Cierre de sesión':'Inicio de sesión'}));
    hoja(res,'Resumen productos','Sin ventas');hoja(ventas,'Ventas','Sin ventas');hoja(otros,'Movimientos stock','Sin movimientos');hoja(cie,'Cierres','Sin cierres');
    /* hoja Caja: total por barra y cajero en cada medio de pago, para cuadrar */
    const caja={};for(const m of S.movs.filter(x=>x.tipo==='venta')){const k=m.barra+'|'+(m.quien||'');
      const r=caja[k]||(caja[k]={'Barra':barraNom(m.barra),'Cajero':m.quien||'','Ventas':0,'Efectivo':0,'Mercado Pago':0,'Tarjeta':0,'Otros':0,'Total':0});
      const col=m.pago==='efectivo'?'Efectivo':m.pago==='mercadopago'?'Mercado Pago':m.pago==='tarjeta'?'Tarjeta':'Otros';
      r[col]+=+m.total||0;r.Total+=+m.total||0;r.Ventas++}
    const cajaRows=Object.values(caja).sort((a,b)=>a.Barra.localeCompare(b.Barra)||a.Cajero.localeCompare(b.Cajero));
    if(cajaRows.length)cajaRows.push(['Ventas','Efectivo','Mercado Pago','Tarjeta','Otros','Total'].reduce((t,c)=>(t[c]=cajaRows.reduce((a,r)=>a+r[c],0),t),{'Barra':'TOTAL','Cajero':''}));
    hoja(cajaRows,'Caja','Sin ventas');
    hoja(ses,'sesiones','Sin sesiones');
    const buf=XLSX.write(wb,{type:'array',bookType:'xlsx'});
    await S.dl.save({filename:`Barras ${ev}.xlsx`,data:buf});toast('Excel listo')}
  catch(e){if(!(e&&e.code==='declined'))toast(e&&e.message?'No se pudo exportar: '+e.message:'No se pudo armar el Excel. Revisá la conexión.',true)}
  finally{S.exportando=false;sched()}}

/* Descarga de archivos en el navegador (reemplaza la capacidad "downloads" de claude.ai) */
const descargaLocal={save:async({filename,data})=>{
  const blob=data instanceof Blob?data:new Blob([data],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
  const url=URL.createObjectURL(blob);const a=document.createElement('a');
  a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),10000);return {status:'saved'}}};

/* ---------- Alertas automáticas en segundo plano ----------
   Completá UNA opción y poné su nombre en "proveedor". Mientras esté vacío, las alertas
   solo se anotan en la consola del navegador (la app funciona igual).
   Ojo: estos datos quedan visibles en el código de la página. */
const ALERTAS = {
  proveedor: '',                       // 'callmebot' (WhatsApp) o 'telegram'
  callmebot: [                         // un objeto por encargado — https://www.callmebot.com
    // { telefono: '5493731123456', apikey: '1234567' },
  ],
  telegram: {
    token: '',                         // token del bot que te da @BotFather
    chatIds: [],                       // ej: ['123456789']
  },
};
function urlsAlerta(mensaje){
  const t=encodeURIComponent(mensaje);
  if(ALERTAS.proveedor==='callmebot')
    return ALERTAS.callmebot.filter(x=>x.telefono&&x.apikey).map(x=>`https://api.callmebot.com/whatsapp.php?phone=${encodeURIComponent(x.telefono)}&text=${t}&apikey=${encodeURIComponent(x.apikey)}`);
  if(ALERTAS.proveedor==='telegram'&&ALERTAS.telegram.token)
    return ALERTAS.telegram.chatIds.map(id=>`https://api.telegram.org/bot${ALERTAS.telegram.token}/sendMessage?chat_id=${encodeURIComponent(id)}&text=${t}`);
  return []}
/* Envía la alerta sin mostrar nada al usuario. Si no hay señal, la guarda y la reintenta sola. */
async function enviarAlertaAutomatica(mensaje){
  const urls=urlsAlerta(mensaje);
  if(!urls.length){console.info('[Alerta By Elites — sin proveedor configurado]',mensaje);return false}
  let ok=true;
  for(const u of urls){
    try{await fetch(u,{method:'GET',mode:'no-cors',cache:'no-store',keepalive:true})}
    catch(e){ok=false;alertaPendiente(u)}}
  return ok}
function alertaPendiente(u){try{const q=JSON.parse(ls('alertasPend')||'[]');q.push(u);ls('alertasPend',JSON.stringify(q.slice(-30)))}catch(e){}}
async function reintentarAlertas(){
  let q=[];try{q=JSON.parse(ls('alertasPend')||'[]')}catch(e){}
  if(!q.length||!navigator.onLine)return;ls('alertasPend','[]');
  for(const u of q){try{await fetch(u,{mode:'no-cors',cache:'no-store'})}catch(e){alertaPendiente(u)}}}
addEventListener('online',reintentarAlertas);setInterval(reintentarAlertas,60000);

/* ---------- datos ---------- */
const subs={};
function err(e){console.error(e);toast(e&&e.code==='permission-denied'?'Firestore rechazó la lectura: revisá las reglas de seguridad.':'Se cortó la conexión con la base. Recargá la página.',true)}
function subEvento(){
  Object.keys(subs).forEach(k=>{if(k.startsWith('ev:')){subs[k]();delete subs[k]}});
  S.part={};S.movsDb=[];S.cierres={};S.sesiones=[];recomputar();const ev=S.config.evento;if(!ev){sched();return}
  const merge=()=>{S.movsDb=[].concat(...Object.values(S.part));recomputar()};
  const coll=S.db.collection('movs');
  /* Solo filtros de igualdad: Firestore los resuelve sin crear índices compuestos.
     Las ventas se leen por barra; cada tipo de movimiento de stock va en su propia consulta. */
  for(const t of ['compra','carga','devolucion','baja','anulacion'])
    subs['ev:t-'+t]=coll.where('evento','==',ev).where('tipo','==',t).onSnapshot(s=>{S.part['t-'+t]=s.docs.map(d=>({id:d.id,...d.data()}));merge()},err);
  for(const b of S.barras)subs['ev:v-'+b.id]=coll.where('evento','==',ev).where('tipo','==','venta').where('barra','==',b.id).onSnapshot(s=>{S.part['v-'+b.id]=s.docs.map(d=>({id:d.id,...d.data()}));merge()},err);
  subs['ev:ses']=S.db.collection('sesiones').where('evento','==',ev).onSnapshot(s=>{S.sesiones=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.at||0)-(b.at||0));sched()},err);
  subs['ev:cierres']=S.db.collection('cierres').where('evento','==',ev).onSnapshot(s=>{S.cierres={};s.docs.forEach(d=>{const x=d.data();S.cierres[x.barra]={id:d.id,...x}});sched()},err)}

let barrasKey='',evKey='';

/* ---------- evento activo ----------
   aplicarEvento: cambia el evento en pantalla al instante (limpia lo que quedó a medias y se suscribe a sus datos).
   cambiarEvento: además lo guarda en Firebase (config/main), así todos los celulares pasan al mismo evento. */
function aplicarEvento(id){
  if((id||'')===evKey)return;
  evKey=id||'';S.config={...S.config,evento:id};
  S.ticket={};S.last=null;S.movQty={};S.conteo={};S.efectivo='';S.rehacer=false;S.cierreBarra='';
  subEvento();sched()}
function cambiarEvento(id,nombre){
  if(!id||id===S.config.evento)return;
  aplicarEvento(id);
  toast('Evento activo: '+(nombre||(S.eventos.find(e=>e.id===id)||{}).nombre||id));
  w(()=>S.db.doc('config/main').set({evento:id},{merge:true}))}
(async()=>{
  /* Arranque de la cola local: migra lo viejo de localStorage y carga lo pendiente */
  try{await migrarColaLocalStorage()}
  catch(e){idbOk=false;try{S.cola=JSON.parse(localStorage.getItem('bf_cola')||'[]')}catch(_){}}
  await colaRefrescar();
  /* ---------- Firebase ---------- */
  let db=null;
  try{
    if(!firebase.apps.length)firebase.initializeApp(firebaseConfig);
    db=firebase.firestore();
    /* Persistencia offline nativa: guarda datos y escrituras en el celular y sincroniza al volver la conexión.
       Falla sin romper nada si hay otra pestaña con otra versión o el navegador no la soporta. */
    await db.enablePersistence({synchronizeTabs:true}).catch(e=>console.warn('Persistencia offline no disponible:',e.code));
  }catch(e){console.error('No se pudo iniciar Firebase',e);db=null}
  S.ready=true;
  if(!db){render();return}
  S.db=db;
  S.dl=descargaLocal;
  addEventListener('offline',sched);addEventListener('online',sched);setTimeout(vaciarCola,1500);
  db.collection('cajeros').onSnapshot(s=>{
    S.cajeros=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.creado||0)-(b.creado||0));
    if(!s.metadata.fromCache||S.cajeros.length)S.cajerosOk=true;
    if(S.cajerosOk&&S.cajSesion&&!cajSesionValida())cerrarCajSesion(false);   /* lo eliminaron o le cambiaron la clave: vuelve a pedir ingreso */
    sched()},err);
  db.collection('productos').onSnapshot(s=>{
    const viejos=s.docs.filter(d=>d.data().categoria==='espirituosa');   /* categoría anterior: pasa a "spirit" */
    S.productos=s.docs.map(d=>{const x=d.data();return {id:d.id,...x,categoria:x.categoria==='espirituosa'?'spirit':x.categoria}}).sort((a,b)=>(a.orden??99)-(b.orden??99));
    if(viejos.length&&rolActual()==='encargado'){const b=db.batch();viejos.forEach(d=>b.update(d.ref,{categoria:'spirit'}));b.commit().catch(()=>{})}
    sched()},err);
  db.collection('eventos').onSnapshot(s=>{S.eventos=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.creado||0)-(b.creado||0));
    if(!s.metadata.fromCache||S.eventos.length)S.eventosOk=true;sched()},err);
  db.collection('barras').onSnapshot(s=>{S.barras=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.orden??99)-(b.orden??99));
    if(S.barra&&!S.barras.some(b=>b.id===S.barra))S.barra='';
    const k=S.barras.map(b=>b.id).join(',');if(k!==barrasKey){barrasKey=k;if(S.config.evento)subEvento()}sched()},err);
  setTimeout(()=>{if(!S.cfgOk){S.cfgOk=true;sched()}},6000);   /* primera vez sin conexión: no quedar trabado en "Cargando" */
  db.doc('config/main').onSnapshot(s=>{
    if(!s.exists&&s.metadata.fromCache)return;     /* caché vacía al arrancar: esperar la respuesta real, no borrar el PIN guardado */
    S.config=s.exists?{...s.data()}:{};S.cfgOk=true;
    ls('pinHash',S.config.pinHash||'');   /* copia local: aunque abra sin internet, arranca como Cajero */
    const ev=S.config.evento||'';if(ev!==evKey){S.config.evento=evKey;aplicarEvento(ev)}   /* otro celular cambió el evento */
    sched()},err);
  render()})();
render();
